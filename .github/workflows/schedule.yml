name: Daily DT0005W CSV Export

on:
  schedule:
    # JST 午前1:53 (UTC 16:53) に自動実行
    - cron: '53 16 * * *'
  workflow_dispatch: # 手動実行用ボタン

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install playwright pyotp gspread pandas google-auth
          playwright install chromium

      - name: スクリプト実行
        env:
          SHALOM_ID: ${{ secrets.SHALOM_ID }}
          SHALOM_PASS: ${{ secrets.SHALOM_PASS }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python export_dt0005w.py
