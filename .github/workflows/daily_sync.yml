name: Daily Shalom Sync

on:
  schedule:
    # 毎日朝 9:00 (JST) に自動実行したい場合などのスケジュール設定（必要に応じて調整してください）
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行用ボタン

jobs:
  sync:
    # 自社PCのセルフホストランナーで実行
    runs-on: self-hosted

    steps:
      # 1. リポジトリのコードを取得
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. 依存ライブラリのインストール（Pythonパッケージ）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      # 3. Playwright (Chromium) のセットアップ
      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      # 4. 同期スクリプトの実行（文字化け・絵文字エラー対策の UTF-8 環境変数を付与）
      - name: Run sync script
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          # ※もし GitHub の Secrets で社労夢のパスワード等を管理している場合は以下のように追記できます
          # SHALOM_ID: ${{ secrets.SHALOM_ID }}
          # SHALOM_PASSWORD: ${{ secrets.SHALOM_PASSWORD }}
        run: python shalom_daily_sync.py
