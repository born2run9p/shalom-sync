name: Shalom Daily Sync

on:
  schedule:
    - cron: '0 22 * * *' # 毎日 JST AM7:00 (UTC 22:00)
  workflow_dispatch:     # 手動実行・GAS連携用

jobs:
  sync:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread playwright pyotp
          playwright install --with-deps chromium

      - name: Run sync script
        env:
          PYTHONIOENCODING: "utf-8"
          SHALOM_ID: ${{ secrets.SHALOM_ID }}
          SHALOM_PASS: ${{ secrets.SHALOM_PASS }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TARGET_SPREADSHEET_KEY: ${{ secrets.TARGET_SPREADSHEET_KEY }}
        run: |
          python shalom_daily_sync.py
