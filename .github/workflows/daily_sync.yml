name: Daily Shalom Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      # Google 認証キーファイルを一時作成するステップ (BOM無し UTF-8)
      - name: Create Google Service Account Key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          $utf8NoBom = New-Object System.Text.UTF8Encoding $False
          [System.IO.File]::WriteAllText("service-account-key.json", $env:GCP_SA_KEY, $utf8NoBom)

      - name: Run sync script
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python shalom_daily_sync.py
