name: Shalom Daily Sync

on:
  schedule:
    - cron: '0 9 * * *' # 毎日定期実行などの設定
  repository_dispatch:
    types: [run-shalom-sync] # HTMLボタン側と文字を合わせる
  workflow_dispatch:

jobs:
  sync:
    runs-on: self-hosted # または ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ★ 以下のステップを追加
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyotp selenium gspread google-auth lxml
          playwright install chromium

      - name: Run sync script
        env:
          SHALOM_ID: ${{ secrets.SHALOM_ID }}
          SHALOM_PASS: ${{ secrets.SHALOM_PASS }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TARGET_SPREADSHEET_KEY: ${{ secrets.TARGET_SPREADSHEET_KEY }}
        run: python shalom_daily_sync.py
