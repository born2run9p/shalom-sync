name: Shalom Daily Sync

on:
  schedule:
    # 日本時間（JST） 08:47 / 12:11 / 14:49 / 17:24 に実行
    - cron: '47 23 * * *' # JST 08:47 (UTC 前日23:47)
    - cron: '11 3 * * *'  # JST 12:11 (UTC 03:11)
    - cron: '49 5 * * *'  # JST 14:49 (UTC 05:49)
    - cron: '24 8 * * *'  # JST 17:24 (UTC 08:24)
  repository_dispatch:
    types: [run-shalom-sync] # HTMLボタン側と文字を合わせる
  workflow_dispatch:

jobs:
  sync:
    runs-on: self-hosted # または ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyotp selenium gspread google-auth lxml
          playwright install chromium

      - name: Run sync script
        env:
          SHALOM_ID: ${{ secrets.SHALOM_ID }}
          SHALOM_PASS: ${{ secrets.SHALOM_PASS }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TARGET_SPREADSHEET_KEY: ${{ secrets.TARGET_SPREADSHEET_KEY }}
        run: python shalom_daily_sync.py
