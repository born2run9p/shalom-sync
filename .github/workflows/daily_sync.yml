name: Run Shalom Daily Sync

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: self-hosted
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v3

# - name: Set up Python
#   uses: actions/setup-python@v4
#   with:
#     python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth playwright pyotp

      - name: Playwrightブラウザのインストール
        run: |
          npx playwright install chromium --with-deps

      - name: 定期同期スクリプトの実行
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TARGET_SPREADSHEET_KEY: ${{ secrets.TARGET_SPREADSHEET_KEY }}
          SHALOM_ID: ${{ secrets.SHALOM_ID }}
          SHALOM_PASS: ${{ secrets.SHALOM_PASS }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: |
          python shalom_daily_sync.py
