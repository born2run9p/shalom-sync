name: 社労夢全従業員データ取得

on:
  workflow_dispatch: # 手動実行ボタン
  schedule:
    # 1) 午前 8:14 JST  -> 23:14 UTC (前日)
    - cron: '14 23 * * *'
    # 2) 正午 12:23 JST  -> 03:23 UTC
    - cron: '23 3 * * *'
    # 3) 17:07 JST      -> 08:07 UTC
    - cron: '7 8 * * *'
    # 4) 午前 0:42 JST  -> 15:42 UTC
    - cron: '42 15 * * *'

jobs:
  scrape:
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          # setup-python のパス、またはOS上の python.exe を自動探査
          $py = if ($env:pythonLocation) { "$env:pythonLocation\python.exe" } else { (Get-Command python -ErrorAction SilentlyContinue).Source }
          if (-not $py) { $py = "python" }

          & $py -m pip install --upgrade pip
          & $py -m pip install pandas pyotp selenium gspread google-auth lxml playwright
          & $py -m playwright install chromium

      - name: スクレイピングの実行
        env:
          SHALOM_ID: ${{ secrets.SHALOM_ID }}
          SHALOM_PASS: ${{ secrets.SHALOM_PASS }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TARGET_SPREADSHEET_KEY: ${{ secrets.TARGET_SPREADSHEET_KEY }}
        run: |
          $py = if ($env:pythonLocation) { "$env:pythonLocation\python.exe" } else { (Get-Command python -ErrorAction SilentlyContinue).Source }
          if (-not $py) { $py = "python" }

          & $py scrape_employees.py
