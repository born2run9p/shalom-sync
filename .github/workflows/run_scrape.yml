name: 社労夢全従業員データ取得

on:
  workflow_dispatch: # ← これがあることで手動実行ボタンが表示されます

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          pip install playwright pyotp gspread google-auth
          playwright install --with-deps chromium

      - name: スクレイピングの実行
        env:
          SHALOM_ID: ${{ secrets.SHALOM_ID }}
          SHALOM_PASS: ${{ secrets.SHALOM_PASS }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python scrape_employees.py
