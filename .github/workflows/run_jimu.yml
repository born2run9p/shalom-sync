name: 社労夢事務組合データ取得

on:
  workflow_dispatch: # 手動実行ボタン
  schedule:
    - cron: '20 23 * * *'
    - cron: '30 3 * * *'
    - cron: '15 8 * * *'
    - cron: '50 15 * * *'

jobs:
  scrape:
    #PO-TA7 を指定して強制的に新しいPCで実行させる
    runs-on: [self-hosted, PO-TA7]

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: 依存ライブラリのインストールとセットアップ
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyotp selenium gspread google-auth lxml
          python -m playwright install chromium

      - name: スクレイピングの実行
        env:
          SHALOM_ID: ${{ secrets.SHALOM_ID }}
          SHALOM_PASS: ${{ secrets.SHALOM_PASS }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TARGET_SPREADSHEET_KEY: ${{ secrets.TARGET_SPREADSHEET_KEY }}
        run: |
          python scrape_jimu.py
