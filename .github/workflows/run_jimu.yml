name: 社労夢事務組合データ取得

on:
  workflow_dispatch: # 手動実行ボタン
  schedule:
    - cron: '20 23 * * *'
    - cron: '30 3 * * *'
    - cron: '15 8 * * *'
    - cron: '50 15 * * *'

jobs:
  scrape:
    runs-on: [self-hosted, PO-TA7]

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストールとセットアップ
        run: |
          & "${{ steps.setup-python.outputs.python-path }}" -m pip install --upgrade pip
          & "${{ steps.setup-python.outputs.python-path }}" -m pip install pandas pyotp selenium gspread google-auth lxml
          & "${{ steps.setup-python.outputs.python-path }}" -m playwright install chromium

      - name: スクレイピングの実行
        env:
          SHALOM_ID: ${{ secrets.SHALOM_ID }}
          SHALOM_PASS: ${{ secrets.SHALOM_PASS }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TARGET_SPREADSHEET_KEY: ${{ secrets.TARGET_SPREADSHEET_KEY }}
        run: |
          & "${{ steps.setup-python.outputs.python-path }}" scrape_jimu.py
