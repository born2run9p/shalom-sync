name: 社労夢事務組合データ取得

on:
  workflow_dispatch: # 手動実行ボタン
  schedule:
    # 全従業員取得と重ならないように5分〜10分程度ズラして設定
    # 1) 午前 8:20 JST  -> 23:20 UTC (前日)
    - cron: '20 23 * * *'
    # 2) 正午 12:30 JST  -> 03:30 UTC
    - cron: '30 3 * * *'
    # 3) 17:15 JST      -> 08:15 UTC
    - cron: '15 8 * * *'
    # 4) 午前 0:50 JST  -> 15:50 UTC
    - cron: '50 15 * * *'

jobs:
  scrape:
    runs-on: self-hosted

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyotp selenium gspread google-auth lxml
          playwright install chromium

      - name: スクレイピングの実行
        env:
          SHALOM_ID: ${{ secrets.SHALOM_ID }}
          SHALOM_PASS: ${{ secrets.SHALOM_PASS }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TARGET_SPREADSHEET_KEY: ${{ secrets.TARGET_SPREADSHEET_KEY }}
        run: |
          python scrape_jimu.py
